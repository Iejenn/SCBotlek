# Bouwt de app en zet hem op GitHub Pages: https://iejenn.github.io/SCBotlek/
# Draait bij elke push naar main of de feature-branch, of handmatig (Actions > Run workflow).
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main, ccr-dfe7f04e-7wz5qs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee deploys tegelijk
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Publieke waarden (komen toch in de browser terecht); beveiliging zit in RLS + RPC's
          VITE_SUPABASE_URL: https://mntceqohafpxxdtxnatq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_UY-KzBHSO_b5yEwVQ4nVuw_Si2a7su7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
